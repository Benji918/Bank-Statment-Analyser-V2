[project]
name = "bank-analyser-be"
version = "0.1.0"
description = "Bank Statement Analyser API"
authors = [{ name = "Benjamin" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic[email]>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.1",
    "presidio-analyzer>=2.2.352",
    "presidio-anonymizer>=2.2.352",
    "ollama>=0.1.8",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "openpyxl>=3.1.2",
    "reportlab>=4.1.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
